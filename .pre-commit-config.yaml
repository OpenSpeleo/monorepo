---
# Root checks validate monorepo orchestration only. Each submodule owns its
# checks and runs them directly from its own repository.
# utilities/ owns separate, explicitly invoked operational-tool checks.
exclude: >-
  (?x)^(
    apps/mobile/
    |apps/web/
    |apps/compass_sidecar/
    |apps/ariane_plugin/
    |packages/python/ariane_lib/
    |packages/python/compass_lib/
    |packages/python/mnemo_lib/
    |packages/python/openspeleo_core/
    |packages/python/openspeleo_lib/
    |packages/rust/
    |utilities/
  )

repos:
  # -------------------------
  # Generic sanity checks
  # -------------------------
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-json
      - id: check-toml
      - id: check-xml
      - id: check-yaml
        # Compose uses custom tags such as !reset.
        args: [--allow-multiple-documents, --unsafe]
      - id: debug-statements
      - id: check-builtin-literals
      - id: check-case-conflict
      - id: check-docstring-first
      - id: detect-private-key

  # -------------------------
  # Markdown formatting
  # -------------------------
  - repo: https://github.com/rbubley/mirrors-prettier
    rev: v3.9.9
    hooks:
      - id: prettier
        name: prettier markdown
        types_or: [markdown]
        args: [--prose-wrap=always]
        # args: [--prose-wrap=always, --embedded-language-formatting=off]

  # -------------------------
  # CI formatting
  # -------------------------
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/adrienverge/yamllint
    rev: v1.38.0
    hooks:
      - id: yamllint
        # Accept GitHub Actions `on` and capitalized YAML booleans.
        args:
          - --config-data
          - |
            extends: default
            rules:
              truthy:
                allowed-values: ['true', 'false', 'True', 'False', 'on']

  - repo: https://github.com/shenxianpeng/hadolint-pre-commit
    # This wrapper bundles Hadolint 2.15.1 in prek's isolated environment.
    rev: v2.15.1.2
    hooks:
      - id: hadolint
        # Allow latest image tags and distro-managed APT package versions.
        args:
          - --ignore
          - DL3007  # Allow `latest` Docker image tags.
          - --ignore
          - DL3008  # Allow APT packages without explicit version pins.
