name: speleodb-monorepo

volumes:
  speleodb_local_postgres_data:
    name: "${COMPOSE_PROJECT_NAME}-postgres-data"
  speleodb_local_postgres_data_backups:
    name: "${COMPOSE_PROJECT_NAME}-postgres-backups"
  speleodb_local_gitlab_config:
    name: "${COMPOSE_PROJECT_NAME}-gitlab-config"
  speleodb_local_gitlab_logs:
    name: "${COMPOSE_PROJECT_NAME}-gitlab-logs"
  speleodb_local_gitlab_data:
    name: "${COMPOSE_PROJECT_NAME}-gitlab-data"
  speleodb_local_rustfs_data:
    name: "${COMPOSE_PROJECT_NAME}-rustfs-data"
  speleodb_local_redis_data:
    name: "${COMPOSE_PROJECT_NAME}-redis-data"
  speleodb_local_monorepo_python_build_cache:
    name: "${COMPOSE_PROJECT_NAME}-python-build-cache"
  speleodb_local_web_node_modules:
    name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-web-node-modules"

networks:
  default:
    name: "${COMPOSE_PROJECT_NAME}-default"

x-monorepo-python-environment: &monorepo_python_environment
  CARGO_HOME: /monorepo-python-build-cache/cargo
  CARGO_TARGET_DIR: /monorepo-python-build-cache/openspeleo-core-target
  # Each submodule is a separate repository with its own ownership check.
  GIT_CONFIG_COUNT: "14"
  GIT_CONFIG_KEY_0: safe.directory
  GIT_CONFIG_VALUE_0: /workspace
  GIT_CONFIG_KEY_1: safe.directory
  GIT_CONFIG_VALUE_1: /workspace/apps/mobile
  GIT_CONFIG_KEY_2: safe.directory
  GIT_CONFIG_VALUE_2: /workspace/apps/web
  GIT_CONFIG_KEY_3: safe.directory
  GIT_CONFIG_VALUE_3: /workspace/apps/compass_sidecar
  GIT_CONFIG_KEY_4: safe.directory
  GIT_CONFIG_VALUE_4: /workspace/apps/ariane_plugin
  GIT_CONFIG_KEY_5: safe.directory
  GIT_CONFIG_VALUE_5: /workspace/packages/python/ariane_lib
  GIT_CONFIG_KEY_6: safe.directory
  GIT_CONFIG_VALUE_6: /workspace/packages/python/compass_lib
  GIT_CONFIG_KEY_7: safe.directory
  GIT_CONFIG_VALUE_7: /workspace/packages/python/mnemo_lib
  GIT_CONFIG_KEY_8: safe.directory
  GIT_CONFIG_VALUE_8: /workspace/packages/python/openspeleo_core
  GIT_CONFIG_KEY_9: safe.directory
  GIT_CONFIG_VALUE_9: /workspace/packages/python/openspeleo_lib
  GIT_CONFIG_KEY_10: safe.directory
  GIT_CONFIG_VALUE_10: /workspace/apps/ariane_plugin/com.arianesline.ariane.plugin.api
  GIT_CONFIG_KEY_11: safe.directory
  GIT_CONFIG_VALUE_11: /workspace/apps/ariane_plugin/com.arianesline.cavelib.api
  GIT_CONFIG_KEY_12: safe.directory
  GIT_CONFIG_VALUE_12: /workspace/packages/rust/compass_data
  GIT_CONFIG_KEY_13: safe.directory
  GIT_CONFIG_VALUE_13: /workspace/utilities/git-backup-cronjob
  # Shells start in /workspace; the shared entrypoint imports compose from /app.
  PYTHONPATH: "/workspace/packages/python/openspeleo_core/src_python:/workspace/packages/python/mnemo_lib:/workspace/packages/python/compass_lib:/workspace/packages/python/openspeleo_lib:/app"
  RUSTUP_TOOLCHAIN: stable
  UV_CACHE_DIR: /monorepo-python-build-cache/uv

x-monorepo-web-environment: &monorepo_web_environment
  <<: *monorepo_python_environment
  AWS_S3_ENDPOINT_URL: http://rustfs:9000
  AWS_S3_BROWSER_ENDPOINT_URL: http://localhost:9000
  AWS_S3_TEST_ENDPOINT_URL: http://rustfs:9000
  # Test HTTP clients run inside Compose; development browser links stay local.
  AWS_S3_TEST_BROWSER_ENDPOINT_URL: http://rustfs:9000
  GITLAB_HOST_URL: gitlab:9080
  GITLAB_TEST_HOST_URL: gitlab:9080
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

x-monorepo-setup-environment: &monorepo_setup_environment
  <<: *monorepo_python_environment
  AWS_S3_ENDPOINT_URL: http://rustfs:9000
  AWS_S3_BROWSER_ENDPOINT_URL: http://localhost:9000
  GITLAB_SETUP_URL: http://gitlab:9080
  POSTGRES_HOST: postgres
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1

services:
  django:
    image: "${COMPOSE_PROJECT_NAME}-django"
    user: dev-user
    restart: unless-stopped
    build:
      args:
        DOCKER_INCLUDE_MONOREPO_RUST_TOOLCHAIN: "1"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-django"
    environment: *monorepo_web_environment
    network_mode: !reset null
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ../..:/workspace:z
      - speleodb_local_web_node_modules:/workspace/apps/web/node_modules
      - speleodb_local_monorepo_python_build_cache:/monorepo-python-build-cache

  postgres:
    image: "${COMPOSE_PROJECT_NAME}-postgres"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-postgres"
    restart: unless-stopped

  redis:
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-redis"
    restart: unless-stopped

  django-webserver:
    image: "${COMPOSE_PROJECT_NAME}-django-webserver"
    user: dev-user
    restart: unless-stopped
    build:
      args:
        DOCKER_INCLUDE_MONOREPO_RUST_TOOLCHAIN: "1"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-django-webserver"
    depends_on:
      django:
        condition: service_started
    environment: *monorepo_web_environment
    network_mode: service:django
    volumes:
      - ../..:/workspace:z
      - speleodb_local_web_node_modules:/workspace/apps/web/node_modules
      - speleodb_local_monorepo_python_build_cache:/monorepo-python-build-cache
    command:
      - /bin/bash
      - -c
      - /workspace/.devcontainer/prepare-web-node-modules.sh && /workspace/.devcontainer/sync-openspeleo-core.sh && exec /start

  celery-worker:
    image: "${COMPOSE_PROJECT_NAME}-django"
    user: dev-user
    restart: unless-stopped
    build:
      args:
        DOCKER_INCLUDE_MONOREPO_RUST_TOOLCHAIN: "1"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-celery-worker"
    environment: *monorepo_web_environment
    network_mode: !reset null
    volumes:
      - ../..:/workspace:z
      - speleodb_local_web_node_modules:/workspace/apps/web/node_modules
      - speleodb_local_monorepo_python_build_cache:/monorepo-python-build-cache
    command:
      - /bin/bash
      - -c
      - /workspace/.devcontainer/prepare-web-node-modules.sh && /workspace/.devcontainer/sync-openspeleo-core.sh && exec /start-celeryworker

  celery-beat:
    image: "${COMPOSE_PROJECT_NAME}-django"
    user: dev-user
    restart: unless-stopped
    build:
      args:
        DOCKER_INCLUDE_MONOREPO_RUST_TOOLCHAIN: "1"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-celery-beat"
    environment: *monorepo_web_environment
    network_mode: !reset null
    volumes:
      - ../..:/workspace:z
      - speleodb_local_web_node_modules:/workspace/apps/web/node_modules
      - speleodb_local_monorepo_python_build_cache:/monorepo-python-build-cache
    command:
      - /bin/bash
      - -c
      - /workspace/.devcontainer/prepare-web-node-modules.sh && /workspace/.devcontainer/sync-openspeleo-core.sh && exec /start-celerybeat

  kanchi:
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-kanchi"
    restart: unless-stopped

  celery-test-redis:
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-celery-test-redis"

  gitlab:
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-gitlab"
    restart: unless-stopped

  rustfs:
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-rustfs"
    restart: unless-stopped

  setup:
    image: "${COMPOSE_PROJECT_NAME}-django"
    user: root
    build:
      args:
        DOCKER_INCLUDE_MONOREPO_RUST_TOOLCHAIN: "1"
    container_name: "${COMPOSE_INSTANCE_PREFIX:-${COMPOSE_PROJECT_NAME}}-setup"
    environment: *monorepo_setup_environment
    network_mode: !reset null
    volumes:
      - ../..:/workspace:z
      - speleodb_local_web_node_modules:/workspace/apps/web/node_modules
      - speleodb_local_monorepo_python_build_cache:/monorepo-python-build-cache
    command:
      - /bin/bash
      - -c
      - /workspace/.devcontainer/prepare-web-node-modules.sh && /workspace/.devcontainer/sync-openspeleo-core.sh && exec /app/compose/setup
